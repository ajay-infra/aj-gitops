# edge — the API gateway tier.
#
# APISIX runs here and nothing else. It is the only tier the internet-facing NLB
# targets, which makes it the estate's single ingress point for external traffic.
#
# Separate from `app` deliberately: a gateway that shares nodes with the
# workloads it fronts gives an escaped workload a local path to the thing
# terminating TLS and enforcing authorization.
#
# On-demand only. The gateway is the one component whose eviction takes
# everything down with it — spot interruption here is a full outage, not a
# degraded pod.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: edge
spec:
  template:
    metadata:
      labels:
        workload: edge
        node-pool: edge
        platform.aj/tier: edge
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general-purpose
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m6i.large
            - m6i.xlarge
      taints:
        - key: platform.aj/tier
          value: edge
          effect: NoSchedule
  limits:
    cpu: "32"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
