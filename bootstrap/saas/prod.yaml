# Bootstrap — central-saas-prod
#
# Apply ONCE after provision-central.yml + aj-infra-central complete:
#   kubectl apply -f bootstrap/saas/prod.yaml
#
# Creates two Applications that drive everything else:
#
#   1. bootstrap-central-nonprod
#      → applicationsets/central/saas/prod/   (LGTM stack on this cluster)
#
#   2. bootstrap-workload-saas
#      → applicationsets/workload/saas/
#         Only the saas tree. The other class's hubs sync their own, so an
#         edit here cannot reach a cluster of the other class — and this hub
#         holds no cluster Secret for one either.
#
# Everything after this is ArgoCD-managed. Upgrades = PRs to this repo.
#
# ── BEFORE YOU RUN THIS ───────────────────────────────────────────────────────
#
# The SaaS tree is DORMANT until someone applies this file. Dormant means its
# chart versions, targetRevision pins and versions.yaml entries froze on the day
# the class split was made and have not moved since — nobody upgrades what
# nobody runs.
#
# So this is not a straight apply. It is an activation, and the version review
# comes first:
#
#   1. Diff this tree's chart versions against the product tree's. Product has
#      been maintained; this one has not. Differences are age, not intent.
#   2. Check each pinned chart for advisories published since the freeze.
#   3. Bump what needs bumping, merge that, THEN apply this.
#
# The tree tells you the SHAPE of a SaaS hub. It does not tell you the versions
# are current, and it will look completely healthy while being months stale.

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-central-saas-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL:        https://github.com/ajay-infra/aj-gitops
    targetRevision: v1.0.0
    path:           applicationsets/central/saas/prod

  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-workload-saas
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL:        https://github.com/ajay-infra/aj-gitops
    targetRevision: v1.0.0
    path:           applicationsets/workload/saas

  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m
