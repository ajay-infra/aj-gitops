# Bootstrap — central-nonprod
#
# Apply ONCE after provision-central.yml + aj-infra-central complete:
#   kubectl apply -f bootstrap/nonprod.yaml
#
# Creates two Applications that drive everything else:
#
#   1. bootstrap-central-nonprod
#      → applicationsets/central/nonprod/   (LGTM stack on this cluster)
#
#   2. bootstrap-workload-platform
#      → applicationsets/workload/          (all workload cluster ApplicationSets)
#         k8s-monitoring, apps, arc-runners, aj-cluster-baseline, cloudability
#         These target only clusters registered with this hub (dev + staging).
#
# Everything after this is ArgoCD-managed. Upgrades = PRs to this repo.

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-central-nonprod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL:        https://github.com/ajay-infra/aj-platform-gitops
    targetRevision: v1.0.0
    path:           applicationsets/central/nonprod

  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-workload-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL:        https://github.com/ajay-infra/aj-platform-gitops
    targetRevision: v1.0.0
    path:           applicationsets/workload

  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m
