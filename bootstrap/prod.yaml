# Bootstrap — central-prod
#
# Apply ONCE after provision-central.yml + aj-infra-central complete (prod tier):
#   kubectl apply -f bootstrap/prod.yaml  (targeting central-prod cluster)
#
# Creates two Applications:
#   1. bootstrap-central-prod      → LGTM stack on this cluster
#   2. bootstrap-workload-platform → all workload ApplicationSets
#      (targets prod-blue + prod-green registered with this hub)

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-central-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL:        https://github.com/ajay-infra/aj-platform-gitops
    targetRevision: v1.0.0
    path:           applicationsets/central/prod

  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-workload-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL:        https://github.com/ajay-infra/aj-platform-gitops
    targetRevision: v1.0.0
    path:           applicationsets/workload

  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration:    10s
        factor:      2
        maxDuration: 3m
