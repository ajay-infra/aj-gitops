# Bootstrap — central-prod
#
# Apply with:
#   kubectl apply -f bootstrap/prod.yaml  (targeting central-prod cluster)
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-central-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: https://github.com/ajay-infra/aj-platform-gitops
    targetRevision: main
    path: applicationsets/central/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
