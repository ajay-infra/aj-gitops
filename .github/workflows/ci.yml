name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Uncomment to enable CI on direct push to main (after branch protection is solid)
# on:
#   push:
#     branches: [main]

jobs:
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.16.3"

      - name: Add chart repos
        run: |
          helm repo add argo    https://argoproj.github.io/argo-helm
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Lint ArgoCD values
        run: |
          helm lint --values charts/argocd/values/nonprod.yaml argo/argo-cd --version 7.7.11
          helm lint --values charts/argocd/values/prod.yaml    argo/argo-cd --version 7.7.11

      - name: Lint Grafana values
        run: |
          helm lint --values charts/grafana/values/nonprod.yaml grafana/grafana --version 8.8.4
          helm lint --values charts/grafana/values/prod.yaml    grafana/grafana --version 8.8.4

      - name: Lint Loki values
        run: |
          helm lint --values charts/loki/values/nonprod.yaml grafana/loki --version 6.24.0
          helm lint --values charts/loki/values/prod.yaml    grafana/loki --version 6.24.0

      - name: Lint Mimir values
        run: |
          helm lint --values charts/mimir/values/nonprod.yaml grafana/mimir-distributed --version 5.5.1
          helm lint --values charts/mimir/values/prod.yaml    grafana/mimir-distributed --version 5.5.1

      - name: Lint Tempo values
        run: |
          helm lint --values charts/tempo/values/nonprod.yaml grafana/tempo --version 1.14.0
          helm lint --values charts/tempo/values/prod.yaml    grafana/tempo --version 1.14.0

      - name: Lint Argo Rollouts values
        run: |
          helm lint --values charts/argo-rollouts/values/dev.yaml     argo/argo-rollouts --version 2.38.0
          helm lint --values charts/argo-rollouts/values/staging.yaml argo/argo-rollouts --version 2.38.0
          helm lint --values charts/argo-rollouts/values/prod.yaml    argo/argo-rollouts --version 2.38.0

      - name: Lint k8s-monitoring values
        run: |
          helm lint --values charts/k8s-monitoring/values/dev.yaml     grafana/k8s-monitoring --version 2.0.2
          helm lint --values charts/k8s-monitoring/values/staging.yaml grafana/k8s-monitoring --version 2.0.2
          helm lint --values charts/k8s-monitoring/values/prod.yaml    grafana/k8s-monitoring --version 2.0.2

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 150}}}' \
            applicationsets/ bootstrap/ projects/ charts/

  validate-appsets:
    name: Validate ApplicationSets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz && mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: |
          kubeconform \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            applicationsets/**/*.yaml bootstrap/*.yaml projects/*.yaml

