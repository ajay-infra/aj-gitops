name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Uncomment to enable CI on direct push to main (after branch protection is solid)
# on:
#   push:
#     branches: [main]

jobs:
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.16.3"

      - name: Add chart repos
        run: |
          helm repo add argo    https://argoproj.github.io/argo-helm
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      # helm lint only works on local chart directories.
      # For remote charts, use helm template (renders + validates values) and discard output.
      - name: Validate ArgoCD values
        run: |
          helm template argocd argo/argo-cd --version 7.7.11 --values charts/argocd/values/nonprod.yaml > /dev/null
          helm template argocd argo/argo-cd --version 7.7.11 --values charts/argocd/values/prod.yaml > /dev/null

      - name: Validate Grafana values
        run: |
          helm template grafana grafana/grafana --version 8.8.4 --values charts/grafana/values/nonprod.yaml > /dev/null
          helm template grafana grafana/grafana --version 8.8.4 --values charts/grafana/values/prod.yaml > /dev/null

      - name: Validate Loki values
        run: |
          helm template loki grafana/loki --version 6.24.0 --values charts/loki/values/nonprod.yaml > /dev/null
          helm template loki grafana/loki --version 6.24.0 --values charts/loki/values/prod.yaml > /dev/null

      - name: Validate Mimir values
        run: |
          helm template mimir grafana/mimir-distributed --version 5.5.1 --values charts/mimir/values/nonprod.yaml > /dev/null
          helm template mimir grafana/mimir-distributed --version 5.5.1 --values charts/mimir/values/prod.yaml > /dev/null

      - name: Validate Tempo values
        run: |
          helm template tempo grafana/tempo --version 1.14.0 --values charts/tempo/values/nonprod.yaml > /dev/null
          helm template tempo grafana/tempo --version 1.14.0 --values charts/tempo/values/prod.yaml > /dev/null

      - name: Validate Argo Rollouts values
        run: |
          helm template argo-rollouts argo/argo-rollouts --version 2.38.0 --values charts/argo-rollouts/values/dev.yaml > /dev/null
          helm template argo-rollouts argo/argo-rollouts --version 2.38.0 --values charts/argo-rollouts/values/staging.yaml > /dev/null
          helm template argo-rollouts argo/argo-rollouts --version 2.38.0 --values charts/argo-rollouts/values/prod.yaml > /dev/null

      - name: Validate k8s-monitoring values
        run: |
          helm template k8s-monitoring grafana/k8s-monitoring --version 2.0.2 --values charts/k8s-monitoring/values/dev.yaml > /dev/null
          helm template k8s-monitoring grafana/k8s-monitoring --version 2.0.2 --values charts/k8s-monitoring/values/staging.yaml > /dev/null
          helm template k8s-monitoring grafana/k8s-monitoring --version 2.0.2 --values charts/k8s-monitoring/values/prod.yaml > /dev/null

  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: yamllint applicationsets/ bootstrap/ projects/ charts/

  validate-appsets:
    name: Validate ApplicationSets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz && mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: |
          kubeconform \
            -schema-location default \
            -ignore-missing-schemas \
            -summary \
            applicationsets/**/*.yaml bootstrap/*.yaml projects/*.yaml
          # Note: -ignore-missing-schemas skips ArgoCD CRDs (ApplicationSet, AppProject)
          # since their template variables (e.g. prune: "{{autoSync}}") don't pass
          # strict boolean type checks in external schema catalogs.

