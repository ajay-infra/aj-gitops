---
# One CI for the whole GitOps repo.
#
# Replaced three near-identical workflows — one per absorbed repo — that each
# installed the same tools to run the same checks. The two nested .github
# directories were inert anyway: GitHub reads only the root one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - name: Lint
        # chart templates are Go templates, not YAML — helm lint checks those.
        run: |
          yamllint applicationsets/ bootstrap/ projects/ charts/ \
                   baseline/ workloads/registry/ \
                   workloads/chart/Chart.yaml workloads/chart/values.yaml

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: The namespace chart
        run: |
          helm lint workloads/chart \
            --set namespace=lint --set cluster=lint --set class=product \
            --set customer=internal --set team=t --set segment=app --set quota=small

  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeconform /usr/local/bin/
      - name: ApplicationSets, projects, bootstrap and baseline
        # -ignore-missing-schemas skips CRDs not in the default schema set
        # (ApplicationSet, AppProject, CiliumNetworkPolicy, NodePool, …).
        #
        # `find`, not shell globs. This was:
        #
        #   applicationsets/**/*.yaml bootstrap/*.yaml projects/*.yaml
        #
        # bash does not expand `**` unless globstar is set, so that first
        # pattern only ever matched depth 2 — it was validating a subset and
        # reporting success. The class split moved every file a level deeper and
        # turned the silent subset into a loud failure, which is the only reason
        # it was noticed. Depth-independent now.
        run: |
          FILES="$(find applicationsets bootstrap projects -name '*.yaml' -type f | sort)"
          COUNT="$(printf '%s\n' "$FILES" | grep -c . || true)"
          echo "validating $COUNT manifest(s)"
          if [ "$COUNT" -lt 20 ]; then
            echo "::error::only $COUNT manifests found — the search is matching"
            echo "::error::less than the tree holds. Refusing to report success."
            exit 1
          fi
          # shellcheck disable=SC2086
          kubeconform -schema-location default -ignore-missing-schemas -summary \
            $FILES baseline/falcon/

  policy:
    name: Policy — gator, rego, and every real namespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install gator and opa
        run: |
          curl -sL https://github.com/open-policy-agent/gatekeeper/releases/download/v3.17.1/gator-v3.17.1-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin gator
          curl -sL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa

      - name: Gatekeeper policies behave as claimed
        run: gator verify baseline/policies/tests/suite.yaml

      # `opa check` proves the policy compiles. These prove it BEHAVES: that an
      # unsigned token is rejected, that a wrong issuer or audience is rejected,
      # and — the one that matters most — that an EMPTY issuer list denies
      # rather than default-allows. All three fail open if got wrong.
      #
      # The Rego lives inside ConfigMaps, so it has to be extracted before it
      # can be tested. `opa test baseline/opa/` reads the YAML and fails.
      - name: Extract Rego from the policy ConfigMaps
        run: |
          mkdir -p /tmp/rego
          python3 - <<'PYEOF'
          import yaml, glob, os
          for f in glob.glob('baseline/opa/*.yaml'):
              doc = yaml.safe_load(open(f))
              for name, body in (doc.get('data') or {}).items():
                  if name.endswith('.rego'):
                      open(os.path.join('/tmp/rego', name), 'w').write(body)
                      print('extracted', name, 'from', f)
          PYEOF
          cp baseline/opa/tests/*.rego /tmp/rego/

      - name: APISIX authz policy behaves
        run: opa test /tmp/rego -v

      - name: Every real namespace against the live constraints
        # The check that could NOT run before consolidation: it had to read the
        # constraints from another private repo, and GH_MODULES_TOKEN does not
        # exist in this org. Both halves are in this repo now, so it just runs.
        run: python3 workloads/scripts/validate.py baseline
