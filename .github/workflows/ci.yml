name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Uncomment to enable automatic CI on push/PR
# on:
#   push:
#     branches: [main]

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint all YAML
        run: |
          yamllint \
            namespaces/ \
            policies/ \
            karpenter/ \
            keda/ \
            apisix/ \
            opa/ \
            network-policies/ \
            external-secrets/ \
            falcon/
        # No cloudability/ directory exists yet — see CLAUDE.md Known TODOs
        # ("Add Cloudability agent manifest (or confirm it is fully handled by the
        # ApplicationSet Helm install)"). Add it back to this list if that manifest
        # ever lands here.

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz && mv kubeconform /usr/local/bin/
      - name: Validate native K8s resources
        run: |
          kubeconform \
            -schema-location default \
            -ignore-missing-schemas \
            -summary \
            -kubernetes-version 1.35.0 \
            namespaces/ \
            falcon/
        # OPA, Karpenter, KEDA, Kong CRDs are not in the default schema —
        # -ignore-missing-schemas skips them; yamllint catches syntax errors.
        # No cloudability/ directory exists yet — see CLAUDE.md Known TODOs.

  validate-opa:
    name: Validate OPA Rego
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -sL https://openpolicyagent.org/downloads/v0.70.0/opa_linux_amd64_static \
            -o /usr/local/bin/opa && chmod +x /usr/local/bin/opa
      - name: Lint Rego policies
        run: |
          for template in policies/templates/*.yaml; do
            echo "Checking $template"
            # Extract and validate Rego blocks
            python3 -c "
          import yaml, sys
          with open('$template') as f:
              doc = yaml.safe_load(f)
          targets = doc.get('spec', {}).get('targets', [])
          for t in targets:
              rego = t.get('rego', '')
              if rego:
                  with open('/tmp/policy.rego', 'w') as out:
                      out.write(rego)
          "
            if [ -f /tmp/policy.rego ]; then
              opa check /tmp/policy.rego && echo "  ✓ Rego valid"
            fi
          done

  apisix-authz-tests:
    name: APISIX authz policy tests (opa test)
    runs-on: ubuntu-latest
    # `opa check` proves the policy compiles. These prove it BEHAVES: that an
    # unsigned token is rejected, that a wrong issuer or audience is rejected,
    # and — the one that matters most — that an EMPTY issuer list denies rather
    # than default-allows. All three fail open if got wrong, and all three are
    # one typo away.
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: |
          curl -sL https://openpolicyagent.org/downloads/v0.70.0/opa_linux_amd64_static \
            -o /usr/local/bin/opa && chmod +x /usr/local/bin/opa
      - name: Extract Rego from policy ConfigMaps
        run: |
          mkdir -p /tmp/rego
          python3 - <<'EOF'
          import yaml, glob, os
          for f in glob.glob('opa/*.yaml'):
              doc = yaml.safe_load(open(f))
              for name, body in (doc.get('data') or {}).items():
                  if name.endswith('.rego'):
                      open(os.path.join('/tmp/rego', name), 'w').write(body)
                      print('extracted', name, 'from', f)
          EOF
          cp opa/tests/*.rego /tmp/rego/
      - name: opa check
        run: opa check /tmp/rego
      - name: opa test
        run: opa test /tmp/rego -v

  policy-tests:
    name: OPA policy behaviour tests (gator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gator
        run: |
          curl -sL https://github.com/open-policy-agent/gatekeeper/releases/download/v3.17.1/gator-v3.17.1-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin gator
          gator version
      - name: Verify policy suites
        # `validate-opa` above only proves the Rego PARSES. This proves it does
        # what it claims: each policy is tested in both directions, so a rule
        # that silently matches nothing fails here instead of looking clean.
        #
        # Includes a named regression case for the 2026-08-25 bug where
        # RequirePodDisruptionBudget's implicit-existential subset check treated
        # one shared label as full PDB coverage, letting an unprotected
        # Deployment through.
        run: gator verify policies/tests/suite.yaml
