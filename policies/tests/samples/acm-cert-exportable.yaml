# The forbidden shape: spec.exportTo makes this an EXPORTABLE public
# certificate — $7/FQDN, $79/wildcard, charged at issuance AND every renewal.
apiVersion: acm.services.k8s.aws/v1alpha1
kind: Certificate
metadata:
  name: exportable-public-cert
  namespace: frontend
spec:
  domainName: app.platform.example.com
  exportTo:
    namespace: frontend
    name: exported-cert-secret
    key: tls.crt
