apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requireproductcode
  annotations:
    description: >-
      The team label must carry a product code (pim/prd + number) on namespaces
      that a product or SaaS line pays for. Separate from require-cost-labels
      because the estate's namespaces do not carry real product codes yet, so
      this ships in dryrun — it reports without blocking until codes are
      assigned. Enforcing it today would reject every existing namespace.
spec:
  crd:
    spec:
      names:
        kind: RequireProductCode
      validation:
        openAPIV3Schema:
          type: object
          properties:
            pattern:
              type: string
            appliesToClasses:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requireproductcode

        # Only namespaces a product or SaaS line pays for need a product code.
        # Platform-owned namespaces — cert-manager, monitoring, falcon — are
        # overhead, not a product, and forcing a code onto them would invent
        # one just to satisfy a rule.
        violation[{"msg": msg}] {
          cls := input.review.object.metadata.labels["platform.aj/class"]
          applies := object.get(input.parameters, "appliesToClasses", [])
          in_list(applies, cls)

          team := input.review.object.metadata.labels.team
          pattern := object.get(input.parameters, "pattern", "")
          pattern != ""
          not regex.match(pattern, team)

          name := object.get(input.review.object.metadata, "name", "<unnamed>")
          msg := sprintf(
            "Namespace '%v' (class %v) has team '%v', which is not a product code. Chargeback groups by this field, so a descriptive slug leaves the spend unattributable to a product. Expected a value matching %v.",
            [name, cls, team, pattern]
          )
        }

        in_list(arr, v) {
          arr[_] == v
        }
