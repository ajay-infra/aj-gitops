# AppProject: platform
#
# Owns all platform-layer Applications — ArgoCD itself, LGTM stack, Alloy.
# Only the infra-lead team can sync platform apps (changes here affect all clusters).
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform layer — ArgoCD, Grafana LGTM, Alloy, ARC, Cloudability

  sourceRepos:
    - https://github.com/ajay-infra/aj-gitops
    # Upstream chart repos
    - https://argoproj.github.io/argo-helm
    - https://grafana.github.io/helm-charts
    - https://apptio.github.io/apptio-cloudability-helm-charts
    - oci://ghcr.io/actions/actions-runner-controller-charts

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
    # Workload cluster destinations
    - namespace: monitoring
      server: "*"
    - namespace: cloudability
      server: "*"
    - namespace: arc-runners
      server: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: admin
      description: Full access to platform project
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - ajay-infra:infra-lead
