# AppProject: workloads
#
# Owns all application workload Applications — frontend, backend, llm, search.
# Separate from platform so app teams can't accidentally touch infra components.
# Per-environment sync policies enforced here (auto-sync dev/staging, manual-gate prod).
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Application workloads — frontend, backend, llm-router, search, rag-worker

  sourceRepos:
    - https://github.com/ajay-infra/k8s-manifests
    - https://github.com/ajay-infra/aj-platform-gitops
    # Team repos — add each team repo URL here when onboarding via register-namespace.yml
    - https://github.com/ajay-infra/*

  destinations:
    # Internal workload clusters (dev / staging / prod blue+green / internal-tools)
    # server: "*" — all registered clusters; namespace is the real scope guard
    - namespace: "*"
      server: "*"

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # Karpenter NodePool + EC2NodeClass
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.k8s.aws
      kind: EC2NodeClass
    # OPA Gatekeeper policies
    - group: templates.gatekeeper.sh
      kind: ConstraintTemplate
    - group: constraints.gatekeeper.sh
      kind: "*"

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  roles:
    - name: dev-deployer
      description: Auto-sync for dev + staging
      policies:
        - p, proj:workloads:dev-deployer, applications, sync, workloads/dev-*, allow
        - p, proj:workloads:dev-deployer, applications, sync, workloads/staging-*, allow
        - p, proj:workloads:dev-deployer, applications, get, workloads/*, allow
      groups:
        - ajay-infra:infra-core
        - ajay-infra:engineers

    - name: prod-deployer
      description: Manual sync gate for prod
      policies:
        - p, proj:workloads:prod-deployer, applications, sync, workloads/prod-*, allow
        - p, proj:workloads:prod-deployer, applications, *, workloads/*, allow
      groups:
        - ajay-infra:infra-lead
