# ArgoCD Application — external-dns on ai-search-prod-green
#
# Static Application (not generated by ApplicationSet) so that txtOwnerId
# is stable and unique to this cluster. Never share txtOwnerId across clusters.
#
# This Application is applied when the green cluster is provisioned.
# Green cluster runs external-dns independently of blue — each manages
# its own ALB hostname → Route53 A record mappings.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-ai-search-prod-green
  namespace: argocd
  labels:
    component: external-dns
    cluster: ai-search-prod-green
    environment: prod
    color: green
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: "1.15.0"
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/charts/external-dns/values/prod-green.yaml

    - repoURL: https://github.com/ajay-infra/aj-gitops
      targetRevision: v1.0.0
      ref: values

  destination:
    name: ai-search-prod-green
    namespace: external-dns

  syncPolicy:
    # No auto-sync for prod — manual approval in ArgoCD UI
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
