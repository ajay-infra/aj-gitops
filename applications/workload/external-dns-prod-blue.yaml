# ArgoCD Application — external-dns on ai-search-prod-blue
#
# Static Application (not generated by ApplicationSet) so that txtOwnerId
# is stable and unique to this cluster. Never share txtOwnerId across clusters.
#
# policy: upsert-only — prod records are not auto-deleted.
# During blue/green: both prod-blue and prod-green run external-dns simultaneously.
# Each owns its own Route53 A records (distinguished by txtOwnerId).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-ai-search-prod-blue
  namespace: argocd
  labels:
    component: external-dns
    cluster: ai-search-prod-blue
    environment: prod
    color: blue
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: "1.15.0"
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/charts/external-dns/values/prod-blue.yaml

    - repoURL: https://github.com/ajay-infra/aj-platform-gitops
      targetRevision: v1.0.0
      ref: values

  destination:
    name: ai-search-prod-blue
    namespace: external-dns

  syncPolicy:
    # No auto-sync for prod — manual approval in ArgoCD UI
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
