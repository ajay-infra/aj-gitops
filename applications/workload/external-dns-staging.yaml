# ArgoCD Application — external-dns on ai-search-staging
#
# Static Application (not generated by ApplicationSet) so that txtOwnerId
# is stable and unique to this cluster. Never share txtOwnerId across clusters.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-ai-search-staging
  namespace: argocd
  labels:
    component: external-dns
    cluster: ai-search-staging
    environment: staging
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns
      chart: external-dns
      targetRevision: "1.15.0"
      helm:
        releaseName: external-dns
        valueFiles:
          - $values/charts/external-dns/values/staging.yaml

    - repoURL: https://github.com/ajay-infra/aj-gitops
      targetRevision: v1.0.0
      ref: values

  destination:
    name: ai-search-staging
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
