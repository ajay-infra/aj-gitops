# Defaults are deliberately INVALID where a value must be stated.
#
# Every field below that carries a real decision defaults to empty and fails the
# template with a named error. The alternative — a plausible default — is how a
# namespace ends up labelled `internal` because nobody chose, which is exactly
# the ambiguity the reserved words `pooled` and `internal` were introduced to
# remove. A default that is merely plausible cannot be told from a decision.
# ── From the PATH, passed as parameters by the ApplicationSet ────────────────
# registry/<class>/<tenant>/<cluster>/<namespace>/namespace.yaml
#
# These are never written in a registry entry. The path is the identity, and a
# field that lives in two places is a field that can disagree with itself.
namespace: ""
class: ""
customer: ""
cluster: ""
# The cluster's stage — from the cluster Secret's `stage` label, passed by the
# ApplicationSet. Chooses what team-NNNN-write may do here (see rbac below).
stage: ""

# ── From the registry entry ─────────────────────────────────────────────────
team: ""
segment: ""
# restricted | baseline | privileged. `audit` and `warn` stay at restricted
# regardless, so raising `enforce` never lowers what gets logged.
podSecurity: restricted
# Key into .Values.quotas below, or `none`.
quota: ""
# SaaS only. The template rejects it on any other class.
productLine: ""

# Quota tiers. A namespace names a tier; it does not write numbers. One place to
# change what "medium" means, and no namespace can invent its own shape.
quotas:
  small:
    requests: { cpu: "2",  memory: 4Gi }
    limits:   { cpu: "4",  memory: 8Gi }
    pods: "20"
  medium:
    requests: { cpu: "8",  memory: 16Gi }
    limits:   { cpu: "16", memory: 32Gi }
    pods: "60"
  large:
    requests: { cpu: "24", memory: 48Gi }
    limits:   { cpu: "48", memory: 96Gi }
    pods: "150"

# Applied to every container that does not set its own. require-resource-limits
# in aj-cluster-baseline REJECTS a container with no limits, so without a
# LimitRange every chart that omits them fails admission.
defaultContainerResources:
  requests: { cpu: 50m,  memory: 64Mi }
  limits:   { cpu: "1",  memory: 1Gi }

# ── RBAC — rendered, never authored (identity-and-access-v1.md §6.3) ────────
# Two RoleBindings per namespace, subjects on the group grammar
# (`<team>-read`, `<team>-write`), roleRefs to the platform ClusterRoles in
# baseline/rbac/. The person has one bit of intent per team — look, or change —
# and the STAGE decides what "change" means. Nobody writes to prod by hand:
# on prod and prodpciconn the write group binds to the viewer role, and the
# change arrives through ArgoCD from a merged PR.
rbac:
  readRole: platform-viewer
  writeRoleByStage:
    nonprod:     platform-developer   # workload CRUD, exec, port-forward, read secrets
    sandbox:     platform-developer
    preprod:     platform-deployer    # rollout / rollback / scale, no exec
    prod:        platform-viewer      # write is read here
    prodpciconn: platform-viewer
