---
# frontend — UI services, web servers
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    app.kubernetes.io/managed-by: argocd
    platform.aj/segment: app
    # Cost attribution. `team` is who OPERATES this; `class` is who PAYS for it,
    # and they are allowed to differ — data-access is operated by platform and
    # paid for by product.
    #
    # No `env` label, deliberately: k8s-manifests is synced verbatim to every
    # cluster from one pinned tag, so a static env label would be wrong in all
    # but one. Environment is a CLUSTER property; Cloudability takes it from
    # there.
    platform.aj/class: product
    platform.aj/customer: internal
    # Pod Security Standards. `restricted` is the strict profile: non-root, no
    # privilege escalation, all capabilities dropped, seccomp RuntimeDefault.
    # The correct default for anything running application code.
    #
    # enforce blocks; audit and warn record. All three at the same level so a
    # violation shows up in the audit log and at kubectl time, rather than only
    # as a rejection someone has to work backwards from.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    team: product
---
