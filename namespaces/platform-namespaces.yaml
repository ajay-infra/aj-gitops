---
# Platform namespaces that no installer declares.
#
# falcon-system used to live here AND be created by `create_namespace = true`
# in aj-infra-platform's falcon.tf, so whichever landed first decided whether it
# had labels. It moved to aj-infra-platform/namespaces.tf on 2026-08-29 — the
# repo that installs a component declares its namespace — and its Pod Security
# and Gatekeeper-exemption labels went with it.
#
# cloudability stays: ArgoCD installs it from a remote chart, but its manifests
# live in this repo, so this is where it is declared. Its ApplicationSet no
# longer carries CreateNamespace=true, which would have raced this declaration
# and won with an unlabelled namespace.

# cloudability — cost allocation agent
apiVersion: v1
kind: Namespace
metadata:
  name: cloudability
  labels:
    app.kubernetes.io/managed-by: argocd
    team: platform
    platform.aj/segment: platform
    # Cost attribution. `team` is who OPERATES this; `class` is who PAYS for it,
    # and they are allowed to differ — data-access is operated by platform and
    # paid for by product.
    #
    # No `env` label, deliberately: k8s-manifests is synced verbatim to every
    # cluster from one pinned tag, so a static env label would be wrong in all
    # but one. Environment is a CLUSTER property; Cloudability takes it from
    # there.
    platform.aj/class: platform
    platform.aj/customer: internal
    # A cost-reporting agent reads the metrics API. It has no reason to need
    # anything `restricted` forbids.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
