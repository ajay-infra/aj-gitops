---
# falcon-system — CrowdStrike Falcon sensor.
#
# `privileged` is required, not sloppiness: an EDR sensor needs host PID, host
# network and elevated capabilities to see what it exists to see. This is the
# one namespace where `restricted` would defeat the component's purpose.
#
# The exemption is narrow by design — it applies to this namespace only, and the
# Gatekeeper ignore label below is scoped the same way.
apiVersion: v1
kind: Namespace
metadata:
  name: falcon-system
  labels:
    app.kubernetes.io/managed-by: argocd
    team: platform
    # OPA Gatekeeper excludes this namespace from no-privileged-containers constraint
    admission.gatekeeper.sh/ignore: "true"
    platform.aj/segment: platform
    # Cost attribution. `team` is who OPERATES this; `class` is who PAYS for it,
    # and they are allowed to differ — data-access is operated by platform and
    # paid for by product.
    #
    # No `env` label, deliberately: k8s-manifests is synced verbatim to every
    # cluster from one pinned tag, so a static env label would be wrong in all
    # but one. Environment is a CLUSTER property; Cloudability takes it from
    # there.
    platform.aj/class: platform
    platform.aj/customer: internal
    # Deliberately privileged — see the note above. Audit and warn remain at
    # `restricted` so anything beyond what the sensor genuinely needs still
    # surfaces in the audit log rather than passing silently.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# cloudability — cost allocation agent
apiVersion: v1
kind: Namespace
metadata:
  name: cloudability
  labels:
    app.kubernetes.io/managed-by: argocd
    team: platform
    platform.aj/segment: platform
    # Cost attribution. `team` is who OPERATES this; `class` is who PAYS for it,
    # and they are allowed to differ — data-access is operated by platform and
    # paid for by product.
    #
    # No `env` label, deliberately: k8s-manifests is synced verbatim to every
    # cluster from one pinned tag, so a static env label would be wrong in all
    # but one. Environment is a CLUSTER property; Cloudability takes it from
    # there.
    platform.aj/class: platform
    platform.aj/customer: internal
    # A cost-reporting agent reads the metrics API. It has no reason to need
    # anything `restricted` forbids.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
