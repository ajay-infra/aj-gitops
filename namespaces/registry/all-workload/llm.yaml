# Undeclared until 2026-08-29. `apps.yaml` in aj-platform-gitops deploys
# llm-router here, and no namespace declaration existed anywhere — it was being
# created implicitly by CreateNamespace=true, which produces no labels at all.
namespace: llm

identity:
  team:     product
  class:    product
  customer: internal
  segment:  app

guardrails:
  podSecurity: restricted
  quota:       large
