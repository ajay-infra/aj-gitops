# app — workload pods.
#
# The important property here is what is ABSENT from ingress: `app` is
# reachable from `edge` and from other `app` pods, and from nothing else. Not
# from the internet, and not from `platform`.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tier-app
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values: [frontend, backend, llm, search]

  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: apisix

    # Same-tier east-west. Broader than ideal — a per-namespace split would be
    # tighter, but that is a decision for when real services exist rather than
    # a guess now.
    - fromEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [frontend, backend, llm, search]

    # Prometheus/Alloy scraping.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring

  egress:
    # To the data tier — and ONLY to the data tier. `app` has no route to the
    # data subnets itself; see data.yaml for why that boundary is real rather
    # than declarative.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: data-access

    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [frontend, backend, llm, search]

    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
