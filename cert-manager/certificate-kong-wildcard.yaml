# Certificate — Kong wildcard TLS
#
# Requests a wildcard cert from Let's Encrypt via the letsencrypt-prod ClusterIssuer.
# cert-manager stores the signed cert + private key as Secret "kong-wildcard-tls"
# in the kong namespace — exactly where the Gateway resource expects it.
#
# TODO: replace *.platform.ai-search.io with the real domain once Route53
#       hosted zone is created and ExternalDNS is wired (DNS step 2 in roadmap).
#
# To validate the full DNS-01 flow first, change issuerRef.name to
# "letsencrypt-staging" — then switch back to "letsencrypt-prod" for real certs.
#
# IAM dependency: cert-manager Pod Identity role must have Route53 write access.
# See clusterissuer-prod.yaml for full prerequisites.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kong-wildcard-tls
  namespace: kong
spec:
  secretName: kong-wildcard-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.platform.ai-search.io"
  dnsNames:
    - "*.platform.ai-search.io"
    - "platform.ai-search.io"
  duration: 2160h    # 90 days (Let's Encrypt max)
  renewBefore: 360h  # renew 15 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
