# ApplicationSet — LGTM stack on central-nonprod
#
# Generates one Application per LGTM component.
# Each Application points directly at the upstream Helm chart + values from this repo.
# Components: grafana, loki, mimir-distributed, tempo
#
# ArgoCD is NOT managed here — it is installed and upgraded via the
# bootstrap-argocd.yml workflow (helm upgrade --install). Never add ArgoCD
# back to this list or it will conflict with the workflow-managed release.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: central-nonprod-platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - component: grafana
            chart: grafana
            repoURL: https://grafana.github.io/helm-charts
            version: "8.8.4"
            namespace: monitoring
            valuesFile: charts/grafana/values/nonprod.yaml

          - component: loki
            chart: loki
            repoURL: https://grafana.github.io/helm-charts
            version: "6.24.0"
            namespace: monitoring
            valuesFile: charts/loki/values/nonprod.yaml

          - component: mimir
            chart: mimir-distributed
            repoURL: https://grafana.github.io/helm-charts
            version: "5.5.1"
            namespace: monitoring
            valuesFile: charts/mimir/values/nonprod.yaml

          - component: tempo
            chart: tempo
            repoURL: https://grafana.github.io/helm-charts
            version: "1.14.0"
            namespace: monitoring
            valuesFile: charts/tempo/values/nonprod.yaml

  template:
    metadata:
      name: "central-nonprod-{{component}}"
      namespace: argocd
      annotations:
        # Prevent deletion of monitoring namespace when ArgoCD app is removed
        argocd.argoproj.io/sync-options: "Prune=false"
    spec:
      project: platform

      sources:
        # Source 1: upstream Helm chart
        - repoURL: "{{repoURL}}"
          chart: "{{chart}}"
          targetRevision: "{{version}}"
          helm:
            releaseName: "{{component}}"
            valueFiles:
              # Source 2 (ref): values from this repo
              - $values/{{valuesFile}}

        # Source 2: this repo for values files
        - repoURL: https://github.com/ajay-infra/aj-platform-gitops
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m

      ignoreDifferences:
        # Helm chart renders resource versions that change on every sync
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1config
