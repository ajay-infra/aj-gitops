# ApplicationSet — LGTM stack on central-nonprod
#
# Generates one Application per LGTM component (Grafana, Loki, Mimir, Tempo).
# S3 bucket names are deterministic (from aj-infra-central locals.tf):
#   central-nonprod-loki-chunks   → loki.storage.bucketNames.chunks
#   central-nonprod-mimir-blocks  → mimir.structuredConfig.common.storage.s3.bucket_name
#   central-nonprod-tempo-traces  → tempo.storage.trace.s3.bucket
#
# ArgoCD is NOT managed here — installed via bootstrap-argocd.yml workflow.
# Never add ArgoCD to this list.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: central-nonprod-platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - component:       grafana
            chart:           grafana
            repoURL:         https://grafana.github.io/helm-charts
            version:         "8.8.4"
            namespace:       monitoring
            valuesFile:      charts/grafana/values/nonprod.yaml
            s3BucketParam:   ""   # grafana has no S3 bucket
            s3BucketValue:   ""

          - component:       loki
            chart:           loki
            repoURL:         https://grafana.github.io/helm-charts
            version:         "6.24.0"
            namespace:       monitoring
            valuesFile:      charts/loki/values/nonprod.yaml
            s3BucketParam:   loki.storage.bucketNames.chunks
            s3BucketValue:   central-nonprod-loki-chunks

          - component:       mimir
            chart:           mimir-distributed
            repoURL:         https://grafana.github.io/helm-charts
            version:         "5.5.1"
            namespace:       monitoring
            valuesFile:      charts/mimir/values/nonprod.yaml
            s3BucketParam:   mimir.structuredConfig.common.storage.s3.bucket_name
            s3BucketValue:   central-nonprod-mimir-blocks

          - component:       tempo
            chart:           tempo
            repoURL:         https://grafana.github.io/helm-charts
            version:         "1.14.0"
            namespace:       monitoring
            valuesFile:      charts/tempo/values/nonprod.yaml
            s3BucketParam:   tempo.storage.trace.s3.bucket
            s3BucketValue:   central-nonprod-tempo-traces

  template:
    metadata:
      name: "central-nonprod-{{component}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-options: "Prune=false"
    spec:
      project: platform

      sources:
        - repoURL:        "{{repoURL}}"
          chart:          "{{chart}}"
          targetRevision: "{{version}}"
          helm:
            releaseName: "{{component}}"
            valueFiles:
              - $values/{{valuesFile}}
            parameters:
              # Inject S3 bucket name for storage-backed components.
              # Empty s3BucketParam (Grafana) is ignored by Helm.
              - name:  "{{s3BucketParam}}"
                value: "{{s3BucketValue}}"

        - repoURL:        https://github.com/ajay-infra/aj-platform-gitops
          targetRevision: main
          ref: values

      destination:
        server:    https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune:    true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 3
          backoff:
            duration:    30s
            factor:      2
            maxDuration: 5m

      ignoreDifferences:
        - group: apps
          kind:  Deployment
          jsonPointers:
            - /spec/template/metadata/annotations/checksum~1config
