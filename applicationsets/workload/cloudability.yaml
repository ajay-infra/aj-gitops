# ApplicationSet — Cloudability cost allocation agent on all workload clusters
#
# Deploys one cloudability/metrics-agent Helm release per workload cluster.
# Provides per-namespace + per-container cost breakdown and rightsizing
# recommendations in the Cloudability dashboard.
#
# Prerequisites per cluster:
#   1. ExternalSecret "cloudability-api-key" in cloudability namespace
#      (ESO pulls the API key from Secrets Manager — created by aj-infra-platform)
#   2. Pod Identity or IRSA not required — agent only reads K8s metrics API
#
# All environments auto-sync — cost data collection is always-on.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-cloudability
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: workload
        values:
          env:          "{{metadata.labels.environment}}"
          ecr_registry: "{{metadata.annotations.ecr_registry}}"
          autoSync:     "{{metadata.labels.auto_sync}}"

  template:
    metadata:
      name: "cloudability-{{name}}"
      namespace: argocd
      labels:
        environment: "{{values.env}}"
        component:   cloudability
        cluster:     "{{name}}"
    spec:
      project: platform

      sources:
        - repoURL:        https://apptio.github.io/apptio-cloudability-helm-charts
          chart:          metrics-agent
          targetRevision: "1.0.11"
          helm:
            releaseName: cloudability
            # _default.yaml always loads; the per-environment file overrides it
            # when one exists. ignoreMissingValueFiles means a cluster whose
            # environment label has no profile falls back to the default instead
            # of a permanent sync error — {{values.env}} is the env directory
            # name, and provision-eks lets an operator name a cluster anything.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/cloudability/values/_default.yaml
              - $values/charts/cloudability/values/{{values.env}}.yaml
            parameters:
              - name:  clusterId
                value: "{{name}}"
              - name:  image.repository
                value: "{{values.ecr_registry}}/dockerhub/apptio/cloudability-agent"

        - repoURL:        https://github.com/ajay-infra/aj-platform-gitops
          targetRevision: v1.0.0
          ref: values

      destination:
        server:    "{{server}}"
        namespace: cloudability

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        syncOptions:
          # No CreateNamespace. The namespace is declared in
          # aj-cluster-baseline/namespaces/platform-namespaces.yaml, with the labels
          # cost attribution and network policy both need. Creating it here
          # would race that declaration and win with an UNLABELLED namespace,
          # which Cilium then leaves unrestricted. A missing namespace should
          # fail this sync loudly instead.
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
