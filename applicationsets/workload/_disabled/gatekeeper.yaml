# ⚠️ DISABLED — moved out of applicationsets/workload/ on 2026-08-24.
# Reason: references $values/charts/gatekeeper/values/{{env}}.yaml, but that directory
# was never created — this ApplicationSet would fail to sync (missing Helm
# valueFiles source). See CLAUDE.md Known Gaps for detail.
#
# ArgoCD's bootstrap-workload-platform Application (bootstrap/*.yaml) does NOT
# recurse into subdirectories of applicationsets/workload/ (no directory.recurse
# set), so this file is inert here — safe, reversible, no cluster impact.
#
# To re-enable: add real charts/gatekeeper/values/<env>.yaml files (real config, not
# fabricated — see CLAUDE.md for what each one needs), then move this file back
# up to applicationsets/workload/gatekeeper.yaml.
#
# ApplicationSet — OPA Gatekeeper on all workload clusters
#
# Deploys the Gatekeeper admission controller. ConstraintTemplates + Constraints
# (the actual policies) live in k8s-manifests and are synced separately.
# No IAM needed — Gatekeeper only talks to the K8s API server.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-gatekeeper
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: workload
        values:
          env:          "{{metadata.labels.environment}}"
          ecr_registry: "{{metadata.annotations.ecr_registry}}"
          autoSync:     "{{metadata.labels.auto_sync}}"

  template:
    metadata:
      name: "gatekeeper-{{name}}"
      namespace: argocd
      labels:
        environment: "{{values.env}}"
        component:   gatekeeper
        cluster:     "{{name}}"
    spec:
      project: platform

      sources:
        - repoURL:        https://open-policy-agent.github.io/gatekeeper/charts
          chart:          gatekeeper
          targetRevision: "v3.17.1"
          helm:
            releaseName: gatekeeper
            valueFiles:
              - $values/charts/gatekeeper/values/{{values.env}}.yaml
            parameters:
              - name:  image.repository
                value: "{{values.ecr_registry}}/dockerhub/openpolicyagent/gatekeeper"

        - repoURL:        https://github.com/ajay-infra/aj-platform-gitops
          targetRevision: main
          ref: values

      destination:
        server:    "{{server}}"
        namespace: gatekeeper-system

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration:    30s
            factor:      2
            maxDuration: 5m

      ignoreDifferences:
        - group: "*"
          kind:  ValidatingWebhookConfiguration
          jsonPointers:
            - /webhooks/0/failurePolicy
