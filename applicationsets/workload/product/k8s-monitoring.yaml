# ── product hub only ───────────────────────────────────────────────────────────
# This tree is synced by the product hubs and no other. Editing it cannot reach a
# saas cluster: the saas hubs sync applicationsets/workload/saas/.
#
# The duplication is the isolation. A chart bump wanted on both sides is two
# edits, deliberately — one model can be explored, broken and rolled back
# without the other noticing.
#
# ApplicationSet — k8s-monitoring on all workload clusters
#
# Deploys grafana/k8s-monitoring (includes Alloy) to every ArgoCD-registered
# workload cluster. Ships metrics → central Mimir, logs → central Loki,
# traces → central Tempo over VPC peering.
#
# Cluster Secrets set by provision-eks.yml argocd-register:
#   labels:      tier=workload  environment=<env>  auto_sync=true|false
#   annotations: ecr_registry=<account>.dkr.ecr.<region>.amazonaws.com
#
# ECR pull-through: Alloy image (docker.io/grafana/alloy) routed through
# ECR dockerhub/ prefix. kube-state-metrics (registry.k8s.io) and
# node-exporter (quay.io) are handled by the OPA AssignImage mutation policy.
# Verify alloy image param: helm show values grafana/k8s-monitoring --version 2.0.2
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: product-k8s-monitoring
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: workload
            class: product
        values:
          valuesFile:   "charts/k8s-monitoring/values/{{metadata.labels.environment}}.yaml"
          ecr_registry: "{{metadata.annotations.ecr_registry}}"
          autoSync:     "{{metadata.labels.auto_sync}}"

  template:
    metadata:
      name: "k8s-monitoring-{{name}}"
      namespace: argocd
    spec:
      project: platform

      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: k8s-monitoring
          targetRevision: "2.0.2"
          helm:
            releaseName: k8s-monitoring
            # Same layering as the other workload ApplicationSets. This one
            # composes the path in the generator rather than inline, but the
            # defect was identical: an environment label with no profile meant
            # a missing valueFiles source and a permanent sync error.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/k8s-monitoring/values/_default.yaml
              - $values/{{values.valuesFile}}
            parameters:
              - name: cluster.name
                value: "{{name}}"
              # Route Alloy images through the ECR dockerhub/ pull-through cache.
              #
              # k8s-monitoring 2.x has no top-level `alloy` component: it splits
              # into per-role subcharts (alloy-metrics, alloy-logs,
              # alloy-receiver, ...). `alloy.image.repository` is the v1 shape,
              # it matches nothing in v2, and helm drops an unknown --set
              # silently — so every Alloy pod was pulling from docker.io.
              # One entry per role this estate enables; alloy-receiver is
              # disabled in charts/k8s-monitoring/values/_default.yaml.
              # Verified by render: scripts/render-platform.py asserts each of
              # these appears in the output.
              - name: alloy-metrics.image.repository
                value: "{{values.ecr_registry}}/dockerhub/grafana/alloy"
              - name: alloy-logs.image.repository
                value: "{{values.ecr_registry}}/dockerhub/grafana/alloy"

        - repoURL: https://github.com/ajay-infra/aj-gitops
          targetRevision: v1.0.0
          ref: values

      destination:
        server: "{{server}}"
        namespace: monitoring

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        # ArgoCD installs this from a remote chart and nothing else declares
        # `monitoring`, so ArgoCD declares it — natively, with labels, rather
        # than letting CreateNamespace produce a bare one.
        managedNamespaceMetadata:
          labels:
            team: infra-core
            platform.aj/class: platform
            platform.aj/customer: internal
            platform.aj/segment: platform
            app.kubernetes.io/name: k8s-monitoring
            app.kubernetes.io/managed-by: argocd
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
