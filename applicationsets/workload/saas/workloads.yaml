# ── saas hub only ───────────────────────────────────────────────────────────
# This tree is synced by the saas hubs and no other. Editing it cannot reach a
# product cluster: the product hubs sync applicationsets/workload/product/.
#
# The duplication is the isolation. A chart bump wanted on both sides is two
# edits, deliberately — one model can be explored, broken and rolled back
# without the other noticing.
#
---
# ApplicationSet — namespaces, from the workloads tree
#
#   workloads/registry/<class>/<tenant>/<cluster>/<namespace>/namespace.yaml
#
# THE PATH IS THE IDENTITY. class, tenant and cluster are read from the path and
# passed to the chart as parameters; the file carries only what the path cannot
# say — team, segment, Pod Security level and quota tier. A field that lives in
# both places is a field that can disagree with itself.
#
# HOW THE CLUSTER IS SELECTED, and why this is not the usual cross-product.
# A matrix passes the first generator's parameters INTO the second, so the
# clusters generator selects on a label built from the path:
#
#     environment: "{{index .path.segments 4}}"
#
# That yields exactly one Application per entry, on the one cluster its path
# names. The earlier version matched every workload cluster and relied on the
# directory name as a promise; this makes placement exact and reviewable —
# deleting a directory removes the namespace from that cluster and nowhere else.
#
# Segments of workloads/registry/product/internal/prod/frontend:
#   0 workloads  1 registry  2 class  3 tenant  4 cluster  5 namespace
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: saas-namespaces
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/ajay-infra/aj-gitops
              # Pinned like every other ApplicationSet. It floated on `main`
              # from the day it was written, so one merge reached every cluster
              # at once with no staged rollout — the exact property the pins
              # exist to prevent.
              revision: v1.0.0
              files:
                - path: "workloads/registry/*/*/*/*/namespace.yaml"
          - clusters:
              selector:
                matchLabels:
                  tier: workload
                  class: saas
                  environment: "{{index .path.segments 4}}"
              values:
                autoSync: "{{.metadata.labels.auto_sync}}"

  template:
    metadata:
      name: "ns-{{index .path.segments 5}}-{{index .path.segments 4}}"
      namespace: argocd
      labels:
        component: namespace
        namespace: "{{index .path.segments 5}}"
        team: "{{.team}}"
        cluster: "{{.name}}"
      annotations:
        # Namespaces must exist before anything deployed into them.
        argocd.argoproj.io/sync-wave: "-1"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform

      sources:
        - repoURL: https://github.com/ajay-infra/aj-gitops
          targetRevision: v1.0.0
          path: workloads/chart
          helm:
            releaseName: "ns-{{index .path.segments 5}}"
            parameters:
              # The four the path carries.
              - name: namespace
                value: "{{index .path.segments 5}}"
              - name: class
                value: "{{index .path.segments 2}}"
              - name: customer
                value: "{{index .path.segments 3}}"
              - name: cluster
                value: "{{index .path.segments 4}}"
            valueFiles:
              - $values/{{.path.path}}/namespace.yaml

        - repoURL: https://github.com/ajay-infra/aj-gitops
          targetRevision: v1.0.0
          ref: values

      destination:
        server: "{{.server}}"
        namespace: default

      syncPolicy:
        automated:
          prune: "{{.values.autoSync}}"
          selfHeal: "{{.values.autoSync}}"
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 2m
