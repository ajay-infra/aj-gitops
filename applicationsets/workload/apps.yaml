# ApplicationSet — team app workloads across all internal workload clusters
#
# Matrix generator: clusters (model=internal) × git files (teams/*/*.yaml)
# One Application generated per (cluster, team-app) pair automatically.
#
# How to onboard a team:
#   1. Add teams/<team>/<app>.yaml for each service (see teams/README.md)
#   2. Merge to main → ArgoCD picks it up within ~30s on dev/staging
#   3. For AppProject creation: run register-namespace.yml workflow
#
# Blue/green behaviour:
#   Blue AND green clusters both match model=internal — both get the same apps.
#   No re-registration needed during upgrades.
#
# Sync policy is driven by the cluster Secret label auto_sync (set at argocd-register time):
#   auto_sync=true  → dev + staging (prune + selfHeal on)
#   auto_sync=false → prod (manual sync gate in ArgoCD UI)
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-apps
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          # All internal workload clusters (not SaaS-pooled or SaaS-dedicated)
          - clusters:
              selector:
                matchLabels:
                  tier: workload
                  model: internal
              values:
                env:      "{{metadata.labels.environment}}"
                autoSync: "{{metadata.labels.auto_sync}}"

          # One YAML file per (team, app) — git generator reads teams/*/*.yaml
          # Each file provides: team, namespace, app, repoURL, helmPath
          - git:
              repoURL:  https://github.com/ajay-infra/aj-platform-gitops
              revision: main
              files:
                - path: "teams/*/*.yaml"

  template:
    metadata:
      # Unique per (env, namespace, app, cluster-name)
      name: "{{values.env}}-{{namespace}}-{{app}}-{{name}}"
      namespace: argocd
      labels:
        environment: "{{values.env}}"
        team:        "{{team}}"
        namespace:   "{{namespace}}"
        app:         "{{app}}"
        cluster:     "{{name}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{namespace}}"   # AppProject per namespace — created by register-namespace.yml

      sources:
        # Source 1: Helm chart from team repo
        - repoURL:        "{{repoURL}}"
          targetRevision: main
          path:           "{{helmPath}}"
          helm:
            releaseName: "{{app}}"
            valueFiles:
              # Base deployment overrides from team repo
              - $values/deployments/{{app}}/values.yaml
              # Environment-specific overrides (last wins)
              - $values/environments/{{values.env}}/{{app}}.yaml

        # Source 2: same team repo as values reference
        - repoURL:        "{{repoURL}}"
          targetRevision: main
          ref: values

      destination:
        server:    "{{server}}"
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
