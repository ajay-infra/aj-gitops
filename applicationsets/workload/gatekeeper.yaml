# ApplicationSet — OPA Gatekeeper on all workload clusters
#
# Re-enabled 2026-08-27. It was in _disabled/ because
# charts/gatekeeper/values/<env>.yaml did not exist, which would have put this
# Application into a permanent sync error. Those files now exist for EVERY real
# environment label — dev, staging, prod, prod-regulated, internal-tools,
# team-a-prod — not just dev/staging/prod, because {{values.env}} is the
# cluster's environment label and provision-eks lets an operator name a cluster
# anything.
#
# Unlike arc-controller and falcon, this needed no secret to enable: it needed a
# policy stance. See the values files for the failurePolicy reasoning.
#
#
# Deploys the Gatekeeper admission controller. ConstraintTemplates + Constraints
# (the actual policies) live in baseline/policies/ and are synced separately.
# No IAM needed — Gatekeeper only talks to the K8s API server.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-gatekeeper
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: workload
        values:
          env:          "{{metadata.labels.environment}}"
          ecr_registry: "{{metadata.annotations.ecr_registry}}"
          autoSync:     "{{metadata.labels.auto_sync}}"

  template:
    metadata:
      name: "gatekeeper-{{name}}"
      namespace: argocd
      labels:
        environment: "{{values.env}}"
        component:   gatekeeper
        cluster:     "{{name}}"
    spec:
      project: platform

      sources:
        - repoURL:        https://open-policy-agent.github.io/gatekeeper/charts
          chart:          gatekeeper
          targetRevision: "v3.17.1"
          helm:
            releaseName: gatekeeper
            # _default.yaml always loads; the per-environment file overrides it
            # when one exists. ignoreMissingValueFiles means a cluster whose
            # environment label has no profile falls back to the default instead
            # of a permanent sync error — {{values.env}} is the env directory
            # name, and provision-eks lets an operator name a cluster anything.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/gatekeeper/values/_default.yaml
              - $values/charts/gatekeeper/values/{{values.env}}.yaml
            parameters:
              - name:  image.repository
                value: "{{values.ecr_registry}}/dockerhub/openpolicyagent/gatekeeper"

        - repoURL:        https://github.com/ajay-infra/aj-gitops
          targetRevision: v1.0.0
          ref: values

      destination:
        server:    "{{server}}"
        namespace: gatekeeper-system

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        syncOptions:
          # No CreateNamespace. The namespace is declared in
          # aj-infra-platform/namespaces.tf, with the labels
          # cost attribution and network policy both need. Creating it here
          # would race that declaration and win with an UNLABELLED namespace,
          # which Cilium then leaves unrestricted. A missing namespace should
          # fail this sync loudly instead.
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration:    30s
            factor:      2
            maxDuration: 5m

      ignoreDifferences:
        - group: "*"
          kind:  ValidatingWebhookConfiguration
          jsonPointers:
            - /webhooks/0/failurePolicy
