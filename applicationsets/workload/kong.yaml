# ApplicationSet — Kong Ingress Controller on all workload clusters
#
# Handles all external-facing routes: JWT/OIDC auth, per-consumer rate limiting
# (backed by Valkey), request/response transformations, correlation IDs.
# KongPlugin CRDs live in k8s-manifests.
# No IAM needed — Kong calls no AWS APIs directly.
#
# Images routed through ECR pull-through cache (dockerhub/ prefix → docker.io).
# ecr_registry annotation on cluster Secrets set by provision-eks.yml.
# Verify image parameter paths: helm show values kong/ingress --version 0.4.4
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-kong
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: workload
        values:
          env:          "{{metadata.labels.environment}}"
          autoSync:     "{{metadata.labels.auto_sync}}"
          ecr_registry: "{{metadata.annotations.ecr_registry}}"

  template:
    metadata:
      name: "kong-{{name}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "2"
      labels:
        environment: "{{values.env}}"
        component:   kong
        cluster:     "{{name}}"
    spec:
      project: platform

      sources:
        - repoURL:        https://charts.konghq.com
          chart:          ingress
          targetRevision: "0.4.4"
          helm:
            releaseName: kong
            # _default.yaml always loads; the per-environment file overrides it
            # when one exists. ignoreMissingValueFiles means a cluster whose
            # environment label has no profile falls back to the default instead
            # of a permanent sync error — {{values.env}} is the env directory
            # name, and provision-eks lets an operator name a cluster anything.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/kong/values/_default.yaml
              - $values/charts/kong/values/{{values.env}}.yaml
            parameters:
              # Route all container pulls through ECR dockerhub pull-through cache.
              # docker.io/kong/* → <ecr_registry>/dockerhub/kong/*
              - name: controller.image.repository
                value: "{{values.ecr_registry}}/dockerhub/kong/kubernetes-ingress-controller"
              - name: proxy.image.repository
                value: "{{values.ecr_registry}}/dockerhub/kong/kong-gateway"

        - repoURL:        https://github.com/ajay-infra/aj-platform-gitops
          targetRevision: main
          ref: values

      destination:
        server:    "{{server}}"
        namespace: kong

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration:    30s
            factor:      2
            maxDuration: 5m
