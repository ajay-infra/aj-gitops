# ApplicationSet — ARC Runner Scale Sets on all workload clusters
#
# Deploys one gha-runner-scale-set Helm release per workload cluster.
# The ARC controller (workload-arc-controller) watches these scale sets
# and spins up ephemeral runner pods when GitHub Actions jobs are queued.
#
# Prerequisites per cluster:
#   1. workload-arc-controller Application synced first
#   2. ESO ExternalSecret "arc-github-app-secret" in arc-runners namespace
#      (pulls GitHub App credentials from Secrets Manager)
#   3. Pod Identity association for arc-runner-<env> service account
#
# OCI chart source routed through ECR ghcr/ pull-through cache.
# Runner pod image (ghcr.io/actions/actions-runner) handled by OPA AssignImage.
#
# Workflow usage:
#   runs-on: [self-hosted, dev]      # targets dev cluster runners
#   runs-on: [self-hosted, staging]  # targets staging cluster runners
#   runs-on: [self-hosted, prod]     # targets prod cluster runners
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: arc-runner-sets
  namespace: argocd
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            tier: workload
        values:
          env:          "{{metadata.labels.environment}}"
          ecr_registry: "{{metadata.annotations.ecr_registry}}"
          autoSync:     "{{metadata.labels.auto_sync}}"

  template:
    metadata:
      name: "arc-runners-{{values.env}}-{{name}}"
      namespace: argocd
      labels:
        environment: "{{values.env}}"
        component:   arc-runners
        cluster:     "{{name}}"
    spec:
      project: platform

      sources:
        - repoURL:        "oci://{{values.ecr_registry}}/ghcr/actions/actions-runner-controller-charts"
          chart:          gha-runner-scale-set
          targetRevision: "0.9.3"
          helm:
            releaseName: "arc-runners-{{values.env}}"
            # _default.yaml always loads; the per-environment file overrides it
            # when one exists. ignoreMissingValueFiles means a cluster whose
            # environment label has no profile falls back to the default instead
            # of a permanent sync error — {{values.env}} is the env directory
            # name, and provision-eks lets an operator name a cluster anything.
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/charts/arc-runners/values/_default.yaml
              - $values/charts/arc-runners/values/{{values.env}}.yaml

        - repoURL:        https://github.com/ajay-infra/aj-platform-gitops
          targetRevision: main
          ref: values

      destination:
        server:    "{{server}}"
        namespace: arc-runners

      syncPolicy:
        automated:
          prune:    "{{values.autoSync}}"
          selfHeal: "{{values.autoSync}}"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration:    30s
            factor:      2
            maxDuration: 5m
