# ClusterIssuer — Let's Encrypt staging
#
# Use this for dev + staging clusters. Staging issues untrusted certs but has
# no rate limits — safe for testing the full DNS-01 challenge flow without
# exhausting Let's Encrypt prod quotas (5 certs/week per registered domain).
#
# Prerequisites (wired in aj-infra-platform):
#   1. cert-manager Pod Identity IAM role with Route53 permissions:
#        route53:GetChange
#        route53:ChangeResourceRecordSets
#        route53:ListHostedZonesByName
#   2. aws_eks_pod_identity_association: cert-manager/cert-manager SA → that role
#
# TODO: set hostedZoneID once Route53 hosted zone is created (DNS step 2).
#       Omitting it now — cert-manager discovers the zone via ListHostedZonesByName.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: ajay56611@gmail.com
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            # No credentials block — cert-manager uses EKS Pod Identity
            # (ambient AWS credentials from the cert-manager pod's IAM role)
