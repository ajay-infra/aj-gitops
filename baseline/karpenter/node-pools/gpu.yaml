# GPU node pool — for LLM inference workloads (toggled off in dev/staging)
# Only activate when GPU workloads are deployed.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        workload: gpu-inference
        node-pool: gpu
        platform.aj/segment: app
        nvidia.com/gpu.present: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general-purpose

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge
            - g4dn.2xlarge
            - g5.xlarge
            - g5.2xlarge

      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule

  limits:
    cpu: "64"
    memory: 256Gi

  disruption:
    consolidationPolicy: WhenEmpty # only consolidate when node is fully empty
    consolidateAfter: 5m           # wait 5min to avoid thrashing on inference bursts
