apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: backend
spec:
  template:
    metadata:
      labels:
        workload: backend
        node-pool: backend
        platform.aj/segment: app
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: general-purpose

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"] # on-demand for backend — stateful connections to Aurora/Valkey
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - m6i.xlarge
            - m6i.2xlarge
            - m6i.4xlarge

      taints:
        - key: workload
          value: backend
          effect: NoSchedule

  limits:
    cpu: "200"
    memory: 800Gi

  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 60s # longer window for backend — allows in-flight requests to drain
    budgets:
      - nodes: "10%"
