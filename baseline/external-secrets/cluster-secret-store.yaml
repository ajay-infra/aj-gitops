# ClusterSecretStore — cluster-wide AWS Secrets Manager provider.
# Used by ExternalSecret objects in all workload namespaces.
# Pod Identity grants the ESO service account GetSecretValue permission.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
