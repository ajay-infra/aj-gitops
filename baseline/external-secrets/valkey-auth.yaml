# ExternalSecret — Valkey (Redis-compatible) connection bundle.
# Secret ARN from aj-tf-module-valkey output: secret_arn
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: valkey-auth
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: valkey-auth
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:valkey/auth-token-MOCK02 # MOCK — real ARN from aj-tf-module-valkey output
        property: host
    - secretKey: port
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:valkey/auth-token-MOCK02
        property: port
    - secretKey: auth_token
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:valkey/auth-token-MOCK02
        property: auth_token
    - secretKey: tls_enabled
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:valkey/auth-token-MOCK02
        property: tls_enabled
