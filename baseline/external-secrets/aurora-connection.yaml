# ExternalSecret — Aurora connection config (host, port, dbname, username, region).
# Note: no password field — app uses RDS IAM auth (15-min rotating token via Pod Identity).
# Secret ARN comes from aj-tf-module-aurora output: secret_arn
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aurora-connection
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aurora-connection
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:aurora/app-credentials-MOCK01 # MOCK — real ARN from aj-tf-module-aurora output
        property: host
    - secretKey: reader_host
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:aurora/app-credentials-MOCK01
        property: reader_host
    - secretKey: port
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:aurora/app-credentials-MOCK01
        property: port
    - secretKey: dbname
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:aurora/app-credentials-MOCK01
        property: dbname
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:aurora/app-credentials-MOCK01
        property: username
    - secretKey: region
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:444444444444:secret:aurora/app-credentials-MOCK01
        property: region
