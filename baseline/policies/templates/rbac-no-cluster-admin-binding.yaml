apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: rbacnoclusteradminbinding
  annotations:
    description: >-
      No ClusterRoleBinding may reference cluster-admin. estate-admin and
      estate-break-glass reach cluster-admin through their EKS access entry's
      AmazonEKSClusterAdminPolicy, which lives in the cluster's account and in
      Terraform — not in a manifest anyone can sync. A cluster-admin binding
      in git is the one object that turns any write into every write
      (identity-and-access-v1.md §6.2, §6.4).
spec:
  crd:
    spec:
      names:
        kind: RbacNoClusterAdminBinding
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptNames:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package rbacnoclusteradminbinding

        violation[{"msg": msg}] {
          input.review.object.kind == "ClusterRoleBinding"
          input.review.object.roleRef.name == "cluster-admin"
          not exempt(input.review.object.metadata.name)
          msg := sprintf(
            "ClusterRoleBinding '%v' references cluster-admin. Cluster-admin is granted by the estate-admin / estate-break-glass access entries (AmazonEKSClusterAdminPolicy), never by a binding in git.",
            [input.review.object.metadata.name]
          )
        }

        exempt(name) {
          input.parameters.exemptNames[_] == name
        }
