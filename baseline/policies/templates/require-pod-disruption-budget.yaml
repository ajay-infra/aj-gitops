apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requirepoddisruptionbudget
  annotations:
    description: "Every Deployment must have a matching PodDisruptionBudget to ensure safe node drains during Karpenter consolidation or EKS upgrades."
spec:
  crd:
    spec:
      names:
        kind: RequirePodDisruptionBudget
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requirepoddisruptionbudget

        # This policy runs against Deployments.
        # It checks that a PDB exists with a matching selector in the same namespace.
        # Note: Gatekeeper can check existing resources via data.inventory.
        violation[{"msg": msg}] {
          input.review.kind.kind == "Deployment"
          name := input.review.object.metadata.name
          namespace := input.review.object.metadata.namespace
          selector := input.review.object.spec.selector.matchLabels

          # Look for a matching PDB in the same namespace
          not pdb_exists(namespace, selector)

          msg := sprintf(
            "Deployment '%v' in namespace '%v' must have a matching PodDisruptionBudget.",
            [name, namespace]
          )
        }

        pdb_exists(namespace, selector) {
          pdb := data.inventory.namespace[namespace]["policy/v1"]["PodDisruptionBudget"][_]
          pdb_selector := pdb.spec.selector.matchLabels
          # PDB selector must be a subset of Deployment selector — every key/value
          # pair in pdb_selector must also appear in selector, not just one.
          # (Bug fixed 2026-08-25: the old version only required ONE matching
          # key via Rego's implicit existential quantification over `key`, so a
          # PDB covering an unrelated Deployment that happened to share a single
          # label — e.g. a shared `app` label with a different `tier` — was
          # wrongly treated as covering this one too. Confirmed with `gator test`:
          # two Deployments sharing `app: shared` but differing on `tier`, with a
          # PDB selector matching only the first, produced zero violations for
          # the second, unprotected Deployment.)
          is_subset(pdb_selector, selector)
        }

        is_subset(subset, superset) {
          count({key | subset[key] == superset[key]}) == count(subset)
        }
