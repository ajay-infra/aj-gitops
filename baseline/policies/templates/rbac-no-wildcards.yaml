apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: rbacnowildcards
  annotations:
    description: >-
      A namespaced Role may not use "*" for verbs, resources or apiGroups,
      and may not grant roles / rolebindings. The four platform ClusterRoles
      in baseline/rbac are the vocabulary; a Role is for the narrow extra a
      workload's own ServiceAccount needs. A wildcard Role, or one that can
      write RBAC, is a namespace-admin by another name — and namespace-admin
      is bound to no human on purpose (identity-and-access-v1.md §6.3, §6.4).
spec:
  crd:
    spec:
      names:
        kind: RbacNoWildcards
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package rbacnowildcards

        violation[{"msg": msg}] {
          input.review.object.kind == "Role"
          rule := input.review.object.rules[_]
          field := ["verbs", "resources", "apiGroups"][_]
          rule[field][_] == "*"
          msg := sprintf(
            "Role '%v' in namespace '%v' uses \"*\" in %v. Name what it needs; the platform ClusterRoles cover the common shapes.",
            [input.review.object.metadata.name, input.review.object.metadata.namespace, field]
          )
        }

        violation[{"msg": msg}] {
          input.review.object.kind == "Role"
          rule := input.review.object.rules[_]
          res := rule.resources[_]
          res == ["roles", "rolebindings"][_]
          msg := sprintf(
            "Role '%v' in namespace '%v' grants %v. RBAC in a namespace is rendered by the workloads chart from the record's team; a Role that can write it is an escalation path.",
            [input.review.object.metadata.name, input.review.object.metadata.namespace, res]
          )
        }
