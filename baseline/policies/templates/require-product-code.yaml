apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requireproductcode
  annotations:
    description: >-
      The team label must carry a TEAM CODE — `team-` and four digits — on
      every namespace of every class. The code is opaque: what it is for lives
      in aj-infra/envs/org/teams.yaml (the portal), and check-teams.py there
      fails CI on a code the registry does not know. This template checks the
      SHAPE, so a slug like `payments-team` is caught at admission; the
      registry checks MEMBERSHIP, so `team-9999` is caught in CI before it
      is ever applied. Ships in dryrun until the namespaces Terraform creates
      (aj-infra-central, aj-infra-platform) are confirmed to carry codes too;
      the namespace records in workloads/registry all do as of 2026-09-12.
      The kind is still RequireProductCode: renaming a ConstraintTemplate is
      a CRD change, and the name is history, not meaning.
spec:
  crd:
    spec:
      names:
        kind: RequireProductCode
      validation:
        openAPIV3Schema:
          type: object
          properties:
            pattern:
              type: string
            appliesToClasses:
              type: array
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requireproductcode

        # Every class, since 2026-09-12. A team code is opaque — it says
        # nothing about product vs SaaS vs platform, so there is no reason for
        # the shape rule to differ by class. Class, customer and product line
        # are their own labels with their own constraints. The earlier
        # product-only scope existed because the old pattern (pim/prd + number)
        # was a PRODUCT code; a team code is not.
        violation[{"msg": msg}] {
          cls := input.review.object.metadata.labels["platform.aj/class"]
          applies := object.get(input.parameters, "appliesToClasses", [])
          in_list(applies, cls)

          team := input.review.object.metadata.labels.team
          pattern := object.get(input.parameters, "pattern", "")
          pattern != ""
          not regex.match(pattern, team)

          name := object.get(input.review.object.metadata, "name", "<unnamed>")
          msg := sprintf(
            "Namespace '%v' (class %v) has team '%v', which is not a team code. Chargeback groups by this field, and a descriptive slug is a name nobody registered. Expected a value matching %v — a row in aj-infra/envs/org/teams.yaml.",
            [name, cls, team, pattern]
          )
        }

        in_list(arr, v) {
          arr[_] == v
        }
