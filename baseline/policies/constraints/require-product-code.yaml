apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequireProductCode
metadata:
  name: require-product-code-on-namespaces
  annotations:
    description: >-
      DENY as of 2026-09-13. Every namespace record in workloads/registry
      carries a team code, and a namespace without one now has no RBAC — the
      workloads chart renders the two RoleBindings from `team`, so a missing
      code is a security gap, not a label gap (identity-and-access-v1.md
      §6.4). The Terraform-created namespaces (aj-infra-central's argocd and
      monitoring, aj-infra-platform's twelve) take `team` from var.team,
      team-0001 in every aj-infra tfvars; the modules' own defaults are still
      `infra-core` and are the next thing to fix — a module run on its default
      would now be refused, which is the point.
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - default
      - gatekeeper-system
  parameters:
    # team- and four digits, lowercase. The shape only; the closed list is
    # aj-infra/envs/org/teams.yaml, checked in that repo's CI against every
    # namespace record here. Lives as a parameter so the shape can change
    # without a policy change — a wrong pattern in an enforcing constraint
    # rejects every namespace it matches.
    pattern: "^team-[0-9]{4}$"
    # EVERY class. The old pattern was a product code, so it was scoped to
    # product; a team code is opaque and the same shape everywhere. The
    # class-specific chargeback keys (Customer, ProductLine) have their own
    # constraints and are unaffected by this one.
    appliesToClasses:
      - product
      - saas
      - platform
