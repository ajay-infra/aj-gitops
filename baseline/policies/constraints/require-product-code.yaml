apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequireProductCode
metadata:
  name: require-product-code-on-namespaces
  annotations:
    description: >-
      DRYRUN, still — but the exit condition moved. Every namespace record in
      workloads/registry carries a real code as of 2026-09-12 (team-0002 for
      the platform namespaces, team-0003 for the product ones). What is not
      yet confirmed is the namespaces Terraform creates — aj-infra-central's
      argocd and monitoring, aj-infra-platform's twelve — which take `team`
      from var.team, now team-0001 in every aj-infra tfvars but still
      `infra-core` in the modules' own defaults. Flip to deny once those are
      seen carrying codes in a render.
spec:
  # Reports, does not block. See the note above — this is a readiness state,
  # not a permanent posture.
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - default
      - gatekeeper-system
  parameters:
    # team- and four digits, lowercase. The shape only; the closed list is
    # aj-infra/envs/org/teams.yaml, checked in that repo's CI against every
    # namespace record here. Lives as a parameter so the shape can change
    # without a policy change — a wrong pattern in an enforcing constraint
    # rejects every namespace it matches.
    pattern: "^team-[0-9]{4}$"
    # EVERY class. The old pattern was a product code, so it was scoped to
    # product; a team code is opaque and the same shape everywhere. The
    # class-specific chargeback keys (Customer, ProductLine) have their own
    # constraints and are unaffected by this one.
    appliesToClasses:
      - product
      - saas
      - platform
