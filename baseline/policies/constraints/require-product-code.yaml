apiVersion: constraints.gatekeeper.sh/v1beta1
kind: RequireProductCode
metadata:
  name: require-product-code-on-namespaces
  annotations:
    description: >-
      DRYRUN, deliberately. The estate's namespaces carry team values like
      "product" and "platform", not product codes — so enforcing this today
      would reject every one of them. Dryrun reports violations to the audit log
      without blocking, which is the honest state while the codes are being
      assigned. Flip to deny once they are.
spec:
  # Reports, does not block. See the note above — this is a readiness state,
  # not a permanent posture.
  enforcementAction: dryrun
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Namespace"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - default
      - gatekeeper-system
  parameters:
    # pim/prd + number. Lives here rather than in the template's Rego so that
    # correcting the format is a one-line edit with no policy change — a wrong
    # pattern in an enforcing constraint rejects every namespace it matches.
    pattern: "^(pim|prd)-?[0-9]+$"
    # PRODUCT ONLY. `saas` was here and was wrong: SaaS is a different stack
    # with a different tagging profile, and a per-customer deployment may have
    # no product code at all — its chargeback key is likely `customer`.
    #
    # Applying product's schema to SaaS fails silently rather than loudly: the
    # tags would be satisfiable with values that mean nothing in a SaaS context,
    # so they look complete while the cost data is meaningless.
    #
    # SaaS stays UNENFORCED until its profile is defined — a known gap beats a
    # silent one. See aj-infra-context/arch/tag-profiles.md §5.
    #
    # Platform and sandbox are overhead, not a product.
    appliesToClasses:
      - product
