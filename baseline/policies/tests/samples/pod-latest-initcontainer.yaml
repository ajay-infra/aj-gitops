# The violation is in an initContainer, not a container — a rule with only the
# containers[_] branch would pass this.
apiVersion: v1
kind: Pod
metadata: {name: bad-init, namespace: frontend}
spec:
  initContainers:
    - name: setup
      image: 555555555555.dkr.ecr.us-east-1.amazonaws.com/setup:latest
  containers:
    - name: app
      image: 555555555555.dkr.ecr.us-east-1.amazonaws.com/frontend:v1
