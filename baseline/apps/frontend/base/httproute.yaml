apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  # APISIX replaced Kong as the gateway. The parent Gateway lives in the
  # `apisix` namespace, which is the estate's only `platform.aj/segment: edge`
  # namespace — an HTTPRoute in `app` is reachable from `edge` and nowhere else.
  parentRefs:
    - name: apisix
      namespace: apisix
      sectionName: https
  hostnames:
    - frontend.example.com  # overridden per env in overlay
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
