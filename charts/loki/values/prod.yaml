# Loki — central-prod values
# Chart: grafana/loki
# Mode: SimpleScalable — separate read/write/backend pods.
# Allows independent scaling of ingest vs query path.

deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 2  # 2 write replicas for durability

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    s3:
      region: us-east-1
      bucketnames: ""  # set via --set
      insecure: false

  limits_config:
    retention_period: 2160h  # 90 days for prod
    ingestion_rate_mb: 32
    ingestion_burst_size_mb: 64
    max_query_parallelism: 16
    max_entries_limit_per_query: 100000
    # Per-stream limits to prevent noisy tenants from overwhelming the cluster
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 15MB

  ruler:
    enabled: false  # alerting via Mimir ruler, not Loki

# SimpleScalable topology
write:
  replicas: 2
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: gp3

read:
  replicas: 2
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

backend:
  replicas: 2
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gp3

# Disable single binary
singleBinary:
  replicas: 0

gateway:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

monitoring:
  serviceMonitor:
    enabled: true
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: true  # prod: canary verifies end-to-end log ingestion
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

serviceAccount:
  create: true
  annotations: {}
