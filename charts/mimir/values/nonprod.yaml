# Mimir — central-nonprod values
# Chart: grafana/mimir-distributed
# Mode: single-binary via monolithic target
# Stores metrics from dev + staging workload clusters (Alloy remote-write)

# Use monolithic deployment for nonprod — all components in one StatefulSet
mimir:
  structuredConfig:
    # Single-binary mode: all components in one process
    target: all,alertmanager

    common:
      storage:
        backend: s3
        s3:
          region: us-east-1
          bucket_name: ""  # set via --set mimir.structuredConfig.common.storage.s3.bucket_name=<bucket>

    ingester:
      ring:
        replication_factor: 1  # single binary — no replication

    store_gateway:
      sharding_ring:
        replication_factor: 1

    compactor:
      sharding_ring:
        wait_stability_min_duration: 0s

    limits:
      # 90-day metric retention for nonprod
      compactor_blocks_retention_period: 90d
      # Cardinality limits — prevents runaway series from dev clusters
      max_global_series_per_user: 500000
      max_global_series_per_metric: 50000
      ingestion_rate: 50000
      ingestion_burst_size: 100000

    ruler:
      # Ruler disabled — alerting rules TBD
      enable_api: true

alertmanager:
  enabled: false  # use Grafana alerting (unified alerting) not standalone AM

# Monolithic StatefulSet
minio:
  enabled: false  # use S3, not embedded MinIO

# Disable all distributed components for nonprod
distributor:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
query_frontend:
  replicas: 0
query_scheduler:
  replicas: 0
store_gateway:
  replicas: 0
compactor:
  replicas: 0
ruler:
  replicas: 0

# Single-binary StatefulSet
metaMonitoring:
  serviceMonitor:
    enabled: true

# All-in-one deployment
rollout_operator:
  enabled: false

# Single binary via the "all" target
# Use the nginx gateway for push/query routing
nginx:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Single-binary pod resource sizing
# Receives: dev + staging Alloy remote-write (~50k series combined)
global:
  extraEnvFrom:
    - secretRef:
        name: mimir-s3-credentials  # not needed with Pod Identity — leave as placeholder

serviceAccount:
  create: true
  annotations: {}  # Pod Identity: s3:GetObject, s3:PutObject, s3:DeleteObject on mimir bucket
