# gatekeeper — default values, applied to every cluster.
#
# Layered: this file always loads, then values/<environment>.yaml overrides it
# if one exists (the ApplicationSet sets ignoreMissingValueFiles: true). A
# cluster whose environment label has no profile gets these defaults instead of
# a permanent sync error — the failure that put three ApplicationSets in
# _disabled/ and left keda pointing at a values directory that did not exist.
#
# Derived from dev — the most conservative existing profile. A cluster nobody
# wrote a profile for should get the smallest safe configuration, not a
# production one.
replicas: 1

validatingWebhookFailurePolicy: Ignore
mutatingWebhookFailurePolicy: Ignore

validatingWebhookExemptNamespacesLabels: []
# ⚠ THIS IS THE REAL EXEMPTION SURFACE, and it is wider than it looks.
#
# A namespace here bypasses the Gatekeeper webhook ENTIRELY — not just the
# label constraints, but no-privileged-containers, allowed-registries,
# deny-latest-tag, require-probes and require-resource-limits too. And because
# Kubernetes matches a webhook's namespaceSelector against a Namespace object's
# OWN labels, a namespace named here cannot be rejected at creation either.
#
# That is invisible from the constraint files: their `excludedNamespaces` lists
# name five system namespaces, and reading them alone would tell you these
# eleven are covered. They are not. Anyone reasoning about what Gatekeeper
# enforces has to read this list too.
#
# The list is identical in every environment, prod-regulated included.
#
# `apisix` and `opa` are deliberately ABSENT — the gateway and the policy engine
# are evaluated like any workload. `kong` was here until 2026-08-29 and is gone
# with the rest of Kong.
validatingWebhookIgnoredNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - argocd
      - falcon-system
      - karpenter
      - external-secrets
      - cert-manager
      - monitoring
      - cloudability
      - arc-runners
      - arc-systems
      - gateway-system

auditInterval: 300
constraintViolationsLimit: 100
auditFromCache: false

emitAdmissionEvents: true
emitAuditEvents: true
logDenies: true

controllerManager:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
audit:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
