# ARC Runner Scale Set — prod cluster
githubConfigUrl: "https://github.com/ajay-infra"
githubConfigSecret: "arc-github-app-secret"

runnerScaleSetName: "prod"

minRunners: 1  # always one warm runner in prod — reduces cold-start latency
maxRunners: 10

template:
  spec:
    serviceAccountName: arc-runner-prod
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:2.323.0
        command: ["cp", "-r", "-v", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.323.0
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 4Gi
        env:
          - name: DOCKER_HOST
            value: tcp://localhost:2376
          - name: DOCKER_TLS_VERIFY
            value: "1"
          - name: DOCKER_CERT_PATH
            value: /certs/client
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-cert
            mountPath: /certs/client
            readOnly: true
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=tcp://0.0.0.0:2376
          - --tlsverify
          - --tlscacert=/certs/ca.pem
          - --tlscert=/certs/server-cert.pem
          - --tlskey=/certs/server-key.pem
        securityContext:
          privileged: true
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-cert
            mountPath: /certs
          - name: dind-externals
            mountPath: /home/runner/externals
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-cert
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
