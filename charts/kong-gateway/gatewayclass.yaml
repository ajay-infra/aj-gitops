# GatewayClass — cluster-scoped, tells KIC which Gateway objects it owns.
# controllerName matches KIC's internal registration name.
# konghq.com/gatewayclass-unmanaged: GitOps owns this resource, not KIC.
# Teams reference gatewayClassName: kong in their HTTPRoute resources.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: kong
  annotations:
    konghq.com/gatewayclass-unmanaged: "true"
spec:
  controllerName: konghq.com/kic-gateway-controller
