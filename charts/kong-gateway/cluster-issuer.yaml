# ClusterIssuer — Let's Encrypt production via DNS-01 (Route53)
#
# cert-manager uses Pod Identity to call route53:ChangeResourceRecordSets
# on the platform hosted zone. The Pod Identity association that grants this
# permission is provisioned in aj-infra-platform.
#
# DNS-01 is required for wildcard certs (*.aj-platform.io).
# HTTP-01 cannot issue wildcards.
#
# Prerequisite: cert-manager controller must be running (deployed by
# workload-cert-manager ApplicationSet) before this resource is applied.
# ArgoCD will retry if cert-manager webhooks are not yet ready.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@aj-infra.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            # hostedZoneID scopes cert-manager to only modify this zone.
            # Replace with output of: aws route53 list-hosted-zones-by-name
            #   --dns-name aj-platform.io --query 'HostedZones[0].Id'
            hostedZoneID: PLACEHOLDER_HOSTED_ZONE_ID
---
# Staging issuer — use for testing to avoid Let's Encrypt rate limits.
# Certs issued by this are NOT trusted by browsers; use only in dev/staging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@aj-infra.io
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: PLACEHOLDER_HOSTED_ZONE_ID
