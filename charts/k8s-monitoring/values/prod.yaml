# k8s-monitoring — prod workload cluster (blue + green share same values)
# Chart: grafana/k8s-monitoring
# Ships to central-prod
# cluster.name set via ApplicationSet parameter at deploy time

cluster:
  name: "ai-search-prod-blue" # overridden by ApplicationSet parameter at deploy time

destinations:
  - name: central-mimir
    type: prometheus
    url: http://mimir-nginx.monitoring.central-prod.svc.cluster.local/api/v1/push
    extraConfig: |
      queue_config {
        max_shards           = 20
        max_samples_per_send = 10000
        retry_on_http_429    = true
      }

  - name: central-loki
    type: loki
    url: http://loki-gateway.monitoring.central-prod.svc.cluster.local/loki/api/v1/push

  - name: central-tempo
    type: otlp
    url: http://tempo.monitoring.central-prod.svc.cluster.local:4317
    protocol: grpc
    tls:
      insecure: true

clusterMetrics:
  enabled: true
  destinations: [central-mimir]

podLogs:
  enabled: true
  destinations: [central-loki]

traces:
  enabled: true
  destinations: [central-tempo]

kube-state-metrics:
  enabled: true

node-exporter:
  enabled: true

# Required alloy collectors for enabled features
alloy-metrics:
  enabled: true

alloy-logs:
  enabled: true

alloy-receiver:
  enabled: false

alloy:
  alloy:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
