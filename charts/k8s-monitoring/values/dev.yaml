# k8s-monitoring — dev workload cluster
# Chart: grafana/k8s-monitoring
# Alloy runs underneath — no separate alloy chart needed.

cluster:
  name: ai-search-dev

destinations:
  - name: central-mimir
    type: prometheus
    url: http://mimir-nginx.monitoring.central-nonprod.svc.cluster.local/api/v1/push

  - name: central-loki
    type: loki
    url: http://loki-gateway.monitoring.central-nonprod.svc.cluster.local/loki/api/v1/push

  - name: central-tempo
    type: otlp
    url: http://tempo.monitoring.central-nonprod.svc.cluster.local:4317
    protocol: grpc
    tls:
      insecure: true

clusterMetrics:
  enabled: true
  destinations: [central-mimir]

alloy-metrics:
  enabled: true

podLogs:
  enabled: true
  destinations: [central-loki]

traces:
  enabled: true
  destinations: [central-tempo]

# kube-state-metrics + node-exporter bundled — disable if already in aj-infra-platform
kube-state-metrics:
  enabled: true

node-exporter:
  enabled: true

# Alloy DaemonSet resource sizing for dev (small nodes)
alloy:
  alloy:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

alloy-metrics:
  enabled: true

alloy-logs:
  enabled: true

alloy-receiver:
  enabled: true

