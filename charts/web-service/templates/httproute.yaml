{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "web-service.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "web-service.labels" . | nindent 4 }}
  {{- if .Values.httpRoute.plugins }}
  annotations:
    # Comma-separated list of KongPlugin names in this namespace
    konghq.com/plugins: {{ .Values.httpRoute.plugins | join "," | quote }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
      {{- if .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName }}
      {{- end }}
  hostnames:
    - {{ required "httpRoute.hostname is required when httpRoute.enabled=true" .Values.httpRoute.hostname | quote }}
  rules:
    {{- range .Values.httpRoute.paths }}
    - matches:
        - path:
            type: {{ .type }}
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ include "web-service.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
