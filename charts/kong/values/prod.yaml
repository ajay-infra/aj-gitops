# Kong KIC — prod
replicaCount: 2

proxy:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

ingressController:
  enabled: true
  installCRDs: true  # installs Kong CRDs (KongPlugin, KongConsumer, etc.) — not Gateway API CRDs

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
