# Argo Rollouts — prod workload cluster (blue + green share same values)
# Chart: argo/argo-rollouts

controller:
  replicas: 2  # prod: HA — rollout controller outage = stuck deployments

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
