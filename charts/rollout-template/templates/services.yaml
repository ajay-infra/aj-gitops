# Stable service — carries production traffic before, during, and after rollout.
# Argo Rollouts manages the selector to point at stable pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rollout-template.fullname" . }}-stable
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "rollout-template.labels" . | nindent 4 }}
  annotations:
    konghq.com/protocol: http
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "rollout-template.selectorLabels" . | nindent 4 }}
---
# Canary service — receives canary.weight % of traffic during rollout.
# Argo Rollouts updates the selector to point at canary pods.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rollout-template.fullname" . }}-canary
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "rollout-template.labels" . | nindent 4 }}
  annotations:
    konghq.com/protocol: http
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "rollout-template.selectorLabels" . | nindent 4 }}
