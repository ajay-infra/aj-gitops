# ExternalSecret — pulls Anthropic API key from AWS Secrets Manager.
#
# Secrets Manager path: aj-platform/anthropic/api-key
# Secret format:        {"api_key": "sk-ant-api03-..."}
#
# The resulting K8s Secret (anthropic-api-key) is mounted as env var
# ANTHROPIC_API_KEY in agent runner pods via arc-agent-runners values.
#
# Create the Secrets Manager secret before deploying:
#   aws secretsmanager create-secret \
#     --name aj-platform/anthropic/api-key \
#     --secret-string '{"api_key":"sk-ant-api03-YOUR_KEY_HERE"}'
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: anthropic-api-key
    creationPolicy: Owner
  data:
    - secretKey: api_key
      remoteRef:
        key: aj-platform/anthropic/api-key
        property: api_key
