# ExternalSecret — GitHub PAT for cross-repo operations by agents.
#
# The agent needs a PAT (not the GitHub App token) for:
#   - git clone across org repos (read)
#   - git push feature branches (write)
#   - gh pr create (PR creation)
#
# Required PAT scopes: repo, workflow, read:org
#
# Secrets Manager path: aj-platform/github/agent-pat
# Secret format:        {"token": "ghp_..."}
#
# Rotate by updating the Secrets Manager value — ESO picks up on next refresh.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-agent-pat
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: github-agent-pat
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: aj-platform/github/agent-pat
        property: token
